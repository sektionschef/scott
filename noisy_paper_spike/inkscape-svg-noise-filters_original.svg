<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1000"
   height="700"
   viewBox="0 0 1000 700"
   version="1.1"
   id="svg-noise-filter-playground"
   sodipodi:docname="inkscape-svg-noise-filters.svg"
   inkscape:version="1.3"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#101114"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#101114"
     inkscape:document-units="px" />

  <title>SVG Noise Filter Playground - Inkscape Editable</title>
  <desc>
    Editable Inkscape SVG containing the same procedural filter graph from the interactive index.html:
    macro noise, mid noise, micro grain, displacement, height-map lighting, and final overlay blend.
    Open Object Properties / Fill and Stroke / Filters in Inkscape to inspect and adapt the effect.
  </desc>

  <defs id="defs1">
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#102542" id="gradient-stop-deep-blue" />
      <stop offset="45%" stop-color="#0f8b8d" id="gradient-stop-teal" />
      <stop offset="100%" stop-color="#f2d492" id="gradient-stop-warm" />
    </linearGradient>

    <!-- Main procedural filter from index.html. Each primitive is named for easier editing in Inkscape's XML editor. -->
    <filter
       id="noiseFilter"
       inkscape:label="Layered Noise: macro + mid + grain + displacement + lighting"
       x="-20%"
       y="-20%"
       width="140%"
       height="140%"
       color-interpolation-filters="sRGB">

      <feTurbulence
         id="macroNoise"
         inkscape:label="01 Macro Noise - large marble structure"
         type="fractalNoise"
         baseFrequency="0.008"
         numOctaves="4"
         seed="12"
         result="macroNoise" />

      <feTurbulence
         id="midNoise"
         inkscape:label="02 Mid Noise - veins and ridges"
         type="fractalNoise"
         baseFrequency="0.045"
         numOctaves="3"
         seed="22"
         result="midNoise" />

      <feTurbulence
         id="microNoise"
         inkscape:label="03 Micro Noise - fine grain"
         type="fractalNoise"
         baseFrequency="0.18"
         numOctaves="2"
         seed="33"
         result="microNoise" />

      <feBlend
         id="macroMidBlend"
         inkscape:label="04 Blend macro and mid noise"
         in="macroNoise"
         in2="midNoise"
         mode="multiply"
         result="macroMidNoise" />

      <feComponentTransfer
         id="microOpacityTransfer"
         inkscape:label="05 Reduce micro grain opacity"
         in="microNoise"
         result="microWeighted">
        <feFuncA id="microAlpha" type="table" tableValues="0 0.35" />
      </feComponentTransfer>

      <feBlend
         id="combinedBlend"
         inkscape:label="06 Combine structure and grain"
         in="macroMidNoise"
         in2="microWeighted"
         mode="screen"
         result="combinedNoise" />

      <feDisplacementMap
         id="displacement"
         inkscape:label="07 Displace source graphic"
         in="SourceGraphic"
         in2="combinedNoise"
         scale="65"
         xChannelSelector="R"
         yChannelSelector="G"
         result="distorted" />

      <feColorMatrix
         id="heightMapMatrix"
         inkscape:label="08 Desaturate noise into height map"
         in="combinedNoise"
         type="saturate"
         values="0"
         result="heightMap" />

      <feDiffuseLighting
         id="lighting"
         inkscape:label="09 Diffuse lighting from height map"
         in="heightMap"
         lighting-color="#ffffff"
         surfaceScale="10"
         result="lightingResult">
        <feDistantLight
           id="light"
           azimuth="235"
           elevation="45" />
      </feDiffuseLighting>

      <feBlend
         id="finalBlend"
         inkscape:label="10 Overlay lighting onto distorted source"
         in="distorted"
         in2="lightingResult"
         mode="overlay"
         result="finalImage" />
    </filter>

    <!-- Variant filter: same graph, stronger rocky relief. Useful as a second editable preset. -->
    <filter
       id="noiseFilterRocky"
       inkscape:label="Preset: rocky high-relief noise"
       x="-20%"
       y="-20%"
       width="140%"
       height="140%"
       color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.014" numOctaves="7" seed="121" result="rockMacro" />
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="4" seed="222" result="rockDetail" />
      <feBlend in="rockMacro" in2="rockDetail" mode="multiply" result="rockCombined" />
      <feDisplacementMap in="SourceGraphic" in2="rockCombined" scale="35" xChannelSelector="R" yChannelSelector="G" result="rockDistorted" />
      <feColorMatrix in="rockCombined" type="saturate" values="0" result="rockHeight" />
      <feDiffuseLighting in="rockHeight" lighting-color="#ffffff" surfaceScale="22" result="rockLight">
        <feDistantLight azimuth="210" elevation="35" />
      </feDiffuseLighting>
      <feBlend in="rockDistorted" in2="rockLight" mode="overlay" result="rockFinal" />
    </filter>
  </defs>

  <g id="layer-background" inkscape:groupmode="layer" inkscape:label="Filtered gradient background">
    <rect
       id="filtered-gradient-rect"
       x="0"
       y="0"
       width="1000"
       height="700"
       rx="0"
       ry="0"
       fill="url(#bgGradient)"
       filter="url(#noiseFilter)" />
  </g>

  <g id="layer-shapes" inkscape:groupmode="layer" inkscape:label="Extra filtered shapes">
    <circle
       id="filtered-light-orb"
       cx="240"
       cy="210"
       r="130"
       fill="#ffffff"
       opacity="0.16"
       filter="url(#noiseFilter)" />

    <circle
       id="filtered-dark-orb"
       cx="760"
       cy="470"
       r="180"
       fill="#000000"
       opacity="0.18"
       filter="url(#noiseFilter)" />
  </g>

  <g id="layer-filter-presets" inkscape:groupmode="layer" inkscape:label="Preset samples" style="display:inline">
    <rect
       id="rocky-preset-sample"
       x="40"
       y="545"
       width="220"
       height="110"
       rx="22"
       fill="#6d5f4b"
       opacity="0.7"
       filter="url(#noiseFilterRocky)" />
    <text
       id="preset-label"
       x="55"
       y="675"
       font-family="system-ui, sans-serif"
       font-size="15"
       fill="#ffffff"
       opacity="0.8">Rocky preset sample</text>
  </g>
</svg>
