<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1000"
   height="700"
   viewBox="0 0 1000 700"
   version="1.1"
   id="svg-noise-filter-playground"
   sodipodi:docname="inkscape-svg-noise-filters.svg"
   inkscape:version="1.4.4 (dcaf3e7d9e, 2026-05-05)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/">
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#101114"
     inkscape:document-units="px"
     inkscape:zoom="0.71023902"
     inkscape:cx="298.49106"
     inkscape:cy="366.77793"
     inkscape:window-width="1920"
     inkscape:window-height="1131"
     inkscape:window-x="0"
     inkscape:window-y="0"
     inkscape:window-maximized="1"
     inkscape:current-layer="layer-background" />
  <title
     id="title1">SVG Noise Filter Playground - Inkscape Editable</title>
  <desc
     id="desc1">
    Editable Inkscape SVG containing the same procedural filter graph from the interactive index.html:
    macro noise, mid noise, micro grain, displacement, height-map lighting, and final overlay blend.
    Open Object Properties / Fill and Stroke / Filters in Inkscape to inspect and adapt the effect.
  </desc>
  <defs
     id="defs1">
    <linearGradient
       id="bgGradient"
       x1="0"
       y1="0"
       x2="1"
       y2="1">
      <stop
         offset="0%"
         stop-color="#102542"
         id="gradient-stop-deep-blue" />
      <stop
         offset="45%"
         stop-color="#0f8b8d"
         id="gradient-stop-teal" />
      <stop
         offset="100%"
         stop-color="#f2d492"
         id="gradient-stop-warm" />
    </linearGradient>
    <!-- Main procedural filter from index.html. Each primitive is named for easier editing in Inkscape's XML editor. -->
    <filter
       id="noiseFilter"
       inkscape:label="Layered Noise: macro + mid + grain + displacement + lighting"
       x="-0.0041682652"
       y="-0.0044150699"
       width="1.0083365"
       height="1.0088301"
       color-interpolation-filters="sRGB">
      <feTurbulence
         id="macroNoise"
         inkscape:label="01 Macro Noise - large marble structure"
         type="fractalNoise"
         baseFrequency="0.008"
         numOctaves="4"
         seed="12"
         result="macroNoise" />
      <feTurbulence
         id="midNoise"
         inkscape:label="02 Mid Noise - veins and ridges"
         type="fractalNoise"
         baseFrequency="0.045"
         numOctaves="3"
         seed="22"
         result="midNoise" />
      <feTurbulence
         id="microNoise"
         inkscape:label="03 Micro Noise - fine grain"
         type="fractalNoise"
         baseFrequency="0.18"
         numOctaves="2"
         seed="33"
         result="microNoise" />
      <feBlend
         id="macroMidBlend"
         inkscape:label="04 Blend macro and mid noise"
         in="macroNoise"
         in2="midNoise"
         mode="multiply"
         result="macroMidNoise" />
      <feComponentTransfer
         id="microOpacityTransfer"
         inkscape:label="05 Reduce micro grain opacity"
         in="microNoise"
         result="microWeighted">
        <feFuncA
           id="microAlpha"
           type="table"
           tableValues="0 0.35" />
        <feFuncR
           id="feFuncR3"
           type="identity" />
        <feFuncG
           id="feFuncG3"
           type="identity" />
        <feFuncB
           id="feFuncB3"
           type="identity" />
      </feComponentTransfer>
      <feBlend
         id="combinedBlend"
         inkscape:label="06 Combine structure and grain"
         in="macroMidNoise"
         in2="microWeighted"
         mode="screen"
         result="combinedNoise" />
      <feDisplacementMap
         id="displacement"
         inkscape:label="07 Displace source graphic"
         in="SourceGraphic"
         in2="combinedNoise"
         scale="65"
         xChannelSelector="R"
         yChannelSelector="G"
         result="distorted" />
      <feColorMatrix
         id="heightMapMatrix"
         inkscape:label="08 Desaturate noise into height map"
         in="combinedNoise"
         type="saturate"
         values="0"
         result="heightMap" />
      <feDiffuseLighting
         id="lighting"
         inkscape:label="09 Diffuse lighting from height map"
         in="heightMap"
         lighting-color="#ffffff"
         surfaceScale="10"
         result="lightingResult">
        <feDistantLight
           id="light"
           azimuth="235"
           elevation="45" />
      </feDiffuseLighting>
      <feBlend
         id="finalBlend"
         inkscape:label="10 Overlay lighting onto distorted source"
         in="distorted"
         in2="lightingResult"
         mode="overlay"
         result="finalImage" />
    </filter>
    <!-- Variant filter: same graph, stronger rocky relief. Useful as a second editable preset. -->
    <filter
       id="noiseFilterRocky"
       inkscape:label="Preset: rocky high-relief noise"
       x="-0.0041682652"
       y="-0.0044150699"
       width="1.0083365"
       height="1.0088301"
       color-interpolation-filters="sRGB">
      <feTurbulence
         type="fractalNoise"
         baseFrequency="0.014"
         numOctaves="7"
         seed="121"
         result="rockMacro"
         id="feTurbulence1" />
      <feTurbulence
         type="fractalNoise"
         baseFrequency="0.09"
         numOctaves="4"
         seed="222"
         result="rockDetail"
         id="feTurbulence2" />
      <feBlend
         in="rockMacro"
         in2="rockDetail"
         mode="multiply"
         result="rockCombined"
         id="feBlend2" />
      <feDisplacementMap
         in="SourceGraphic"
         in2="rockCombined"
         scale="35"
         xChannelSelector="R"
         yChannelSelector="G"
         result="rockDistorted"
         id="feDisplacementMap2" />
      <feColorMatrix
         in="rockCombined"
         type="saturate"
         values="0"
         result="rockHeight"
         id="feColorMatrix2" />
      <feDiffuseLighting
         in="rockHeight"
         lighting-color="#ffffff"
         surfaceScale="22"
         result="rockLight"
         id="feDiffuseLighting2">
        <feDistantLight
           azimuth="210"
           elevation="35"
           id="feDistantLight2" />
      </feDiffuseLighting>
      <feBlend
         in="rockDistorted"
         in2="rockLight"
         mode="overlay"
         result="rockFinal"
         id="feBlend3" />
    </filter>
    <filter
       style="color-interpolation-filters:sRGB"
       id="filter3"
       inkscape:label="filter3"
       x="-0.0041682652"
       y="-0.0044150699"
       width="1.2583608"
       height="1.2736584"
       inkscape:auto-region="true">
      <feOffset
         dx="56.676557863501472"
         dy="56.676557863501472"
         id="feOffset16"
         result="result3" />
      <feTurbulence
         id="feTurbulence13"
         baseFrequency="0.02 0.02"
         numOctaves="2"
         type="turbulence"
         result="result1" />
      <feTurbulence
         id="feTurbulence17"
         baseFrequency="0.02 0.02"
         numOctaves="2"
         type="turbulence"
         result="result1"
         seed="135"
         in="result1" />
      <feDisplacementMap
         id="feDisplacementMap16"
         scale="100"
         xChannelSelector="R"
         yChannelSelector="G"
         in="SourceGraphic" />
    </filter>
    <filter
       style="color-interpolation-filters:sRGB"
       id="filter13"
       inkscape:label="filter4"
       x="-0.095268963"
       y="-0.0793908"
       width="1.1905379"
       height="1.1587816">
      <feTurbulence
         id="feTurbulence14"
         baseFrequency="0.030000000000000009"
         type="fractalNoise"
         numOctaves="3"
         seed="0" />
      <feDisplacementMap
         id="feDisplacementMap15"
         in="SourceGraphic"
         scale="54.621809309309313"
         xChannelSelector="R"
         yChannelSelector="B" />
      <feGaussianBlur
         stdDeviation="3"
         id="feGaussianBlur15" />
    </filter>
  </defs>
  <g
     id="layer-background"
     inkscape:groupmode="layer"
     inkscape:label="Filtered gradient background">
    <rect
       style="fill:#6c6c6c;fill-opacity:1;stroke:#727272;stroke-width:1.88976;filter:url(#filter3)"
       id="rect15"
       width="321.7746"
       height="329.64676"
       x="2.9392231"
       y="13.064479"
       transform="matrix(0.95996254,0,0,0.93590456,-1.5417764,-11.751758)" />
    <ellipse
       style="fill:#6c6c6c;fill-opacity:1;stroke:#727272;stroke-width:1.88976;filter:url(#filter3)"
       id="path17"
       cx="627.2536"
       cy="252.02783"
       rx="113.34212"
       ry="107.00623"
       transform="matrix(1.404777,0,0,1.3073014,-304.79091,62.45671)" />
  </g>
  <g
     id="layer-shapes"
     inkscape:groupmode="layer"
     inkscape:label="Extra filtered shapes" />
  <g
     id="layer-filter-presets"
     inkscape:groupmode="layer"
     inkscape:label="Preset samples"
     style="display:inline" />
  <metadata
     id="metadata3">
    <rdf:RDF>
      <cc:Work
         rdf:about="">
        <dc:title>SVG Noise Filter Playground - Inkscape Editable</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
</svg>
