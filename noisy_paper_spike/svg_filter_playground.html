<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SVG Dirty Washed Texture Filter Playground</title>
    <style>
  :root{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#222;background:#ecebe6}
  body{margin:0;display:grid;grid-template-columns:360px 1fr;min-height:100vh}
  aside{background:#f7f6f1;border-right:1px solid #ccc;padding:18px;overflow:auto;box-sizing:border-box}
  main{display:grid;place-items:center;padding:24px}
  h1{font-size:19px;margin:0 0 12px} h2{font-size:14px;margin:22px 0 8px;color:#555;text-transform:uppercase;letter-spacing:.06em}
  label{display:grid;grid-template-columns:1fr 72px;gap:10px;align-items:center;margin:10px 0;font-size:13px}
  input[type=range]{grid-column:1 / -1;width:100%}
  input[type=color]{width:72px;height:32px;border:0;background:transparent}
  button{margin:8px 8px 0 0;padding:8px 10px;border:1px solid #aaa;background:white;border-radius:8px;cursor:pointer}
  button:hover{background:#eee}
  .stage{width:min(100%,1150px);background:#ddd7cc;border-radius:14px;box-shadow:0 20px 60px #0003;padding:18px}
  svg{width:100%;height:auto;display:block;background:#d8d6ce;border-radius:8px}
  textarea{width:100%;height:170px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;box-sizing:border-box;margin-top:8px}
  .hint{font-size:12px;color:#666;line-height:1.4}
</style>
  </head>
  <body>
    <aside>
      <h1>SVG filter playground</h1>
      <p class="hint">Tune the sliders. The SVG updates live. Open this file in
        a browser, then copy the generated filter into Inkscape or your SVG.</p>

      <h2>Paper / dirt</h2>
      <label>Paper color <input id="paperColor" type="color"
          value="#d8d6ce"></label>
      <label>Fine grain frequency <output id="grainFreqOut"></output><input
          id="grainFreq" type="range" min="0.2" max="2.2" step="0.01"
          value="1.64"></label>
      <label>Fine grain opacity <output id="grainOpacityOut"></output><input
          id="grainOpacity" type="range" min="0" max="0.8" step="0.01"
          value="0.42"></label>
      <label>Stain frequency <output id="stainFreqOut"></output><input
          id="stainFreq" type="range" min="0.005" max="0.12" step="0.001"
          value="0.011"></label>
      <label>Stain opacity <output id="stainOpacityOut"></output><input
          id="stainOpacity" type="range" min="0" max="0.8" step="0.01"
          value="0.6"></label>

      <h2>Object aging</h2>
      <label>Displacement <output id="displaceOut"></output><input id="displace"
          type="range" min="0" max="12" step="0.1" value="0"></label>
      <label>Soft blur <output id="blurOut"></output><input id="blur"
          type="range" min="0" max="3" step="0.05" value="0.8"></label>
      <label>Contrast slope <output id="contrastOut"></output><input
          id="contrast" type="range" min="0.35" max="1.4" step="0.01"
          value="0.92"></label>
      <label>Washout lift <output id="washOut"></output><input id="wash"
          type="range" min="0" max="0.35" step="0.01" value="0"></label>
      <label>Shadow blur <output id="shadowBlurOut"></output><input
          id="shadowBlur" type="range" min="0" max="20" step="0.5"
          value="8"></label>
      <label>Shadow opacity <output id="shadowOpacityOut"></output><input
          id="shadowOpacity" type="range" min="0" max="0.7" step="0.01"
          value="0.25"></label>

      <button id="randomize">Randomize seeds</button><button
        id="reset">Reset</button>
      <h2>Export filter</h2>
      <p class="hint">This is the active filter block. Paste it into your SVG
        defs.</p>
      <textarea id="exportCode" spellcheck="false"></textarea>
    </aside>

    <main>
      <div class="stage">
        <svg id="art" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
          <defs id="defs">
            <filter id="paperNoise" x="0" y="0" width="100%" height="100%"
              color-interpolation-filters="sRGB"></filter>
            <filter id="dirtyObject" x="-20%" y="-20%" width="140%"
              height="140%" color-interpolation-filters="sRGB"></filter>
            <filter id="softShadow"><fegaussianblur id="shadowBlurNode"
                stdDeviation="8" /></filter>
            <lineargradient id="cyl" x1="0" y1="0" x2="1" y2="0"><stop
                offset="0" stop-color="#777" /><stop offset=".55"
                stop-color="#d2d2cd" /><stop offset="1"
                stop-color="#777" /></lineargradient>
            <lineargradient id="arch" x1="0" y1="0" x2="1" y2="1"><stop
                offset="0" stop-color="#565656" /><stop offset=".55"
                stop-color="#222" /><stop offset="1"
                stop-color="#aaa" /></lineargradient>
          </defs>
          <rect id="paper" width="1200" height="760" fill="#d8d6ce" />
          <rect width="1200" height="760" filter="url(#paperNoise)"
            opacity="1" />

          <g id="scene" filter="url(#dirtyObject)">
            <path d="M185 520 L720 265 L1005 430 L595 690 Z" fill="#c8c8c0"
              opacity=".72" />
            <g class="shadows" fill="#000" opacity=".25"
              filter="url(#softShadow)">
              <ellipse cx="460" cy="440" rx="170" ry="45"
                transform="rotate(-24 460 440)" />
              <ellipse cx="815" cy="475" rx="155" ry="42"
                transform="rotate(-22 815 475)" />
              <rect x="360" y="520" width="260" height="52" rx="20"
                transform="rotate(-16 360 520)" />
              <rect x="710" y="557" width="170" height="42" rx="18"
                transform="rotate(-13 710 557)" />
              <ellipse cx="965" cy="200" rx="85" ry="34"
                transform="rotate(17 965 200)" />
            </g>

            <path d="M275 365 L345 330 L345 505 L275 540 Z" fill="#5c5c5c" />
            <path d="M205 450 L275 415 L275 540 L205 575 Z" fill="#676767" />
            <path d="M145 505 L205 475 L205 575 L145 605 Z" fill="#555" />
            <path d="M145 505 L205 475 L170 438 Z" fill="#777" />

            <path
              d="M355 305 C470 205 640 205 675 330 L675 458 C630 390 452 385 355 485 Z"
              fill="url(#arch)" />
            <path
              d="M675 330 C730 300 785 315 805 370 L805 500 C760 438 720 428 675 458 Z"
              fill="#9a9a94" opacity=".7" />
            <path
              d="M355 485 C455 390 625 390 675 458 L640 505 C548 455 425 470 355 545 Z"
              fill="#181818" opacity=".85" />

            <g>
              <ellipse cx="525" cy="435" rx="49" ry="26" fill="#d4d4cd" />
              <rect x="476" y="435" width="98" height="150" fill="url(#cyl)" />
              <ellipse cx="525" cy="585" rx="49" ry="26" fill="#9b9b96" />
            </g>
            <g>
              <ellipse cx="680" cy="560" rx="43" ry="24" fill="#d0d0ca" />
              <rect x="637" y="560" width="86" height="112" fill="url(#cyl)" />
              <ellipse cx="680" cy="672" rx="43" ry="24" fill="#888" />
              <circle cx="657" cy="540" r="13" fill="#777" /><circle cx="676"
                cy="528" r="16" fill="#aaa" /><circle cx="697" cy="542" r="13"
                fill="#6f6f6f" />
            </g>

            <path d="M690 382 C725 340 765 342 780 395 L780 518 L690 560 Z"
              fill="#5f5f5f" />
            <path d="M795 405 C825 365 865 372 880 425 L880 540 L795 582 Z"
              fill="#696969" />
            <path
              d="M900 345 C1015 300 1110 365 1088 470 L1088 565 C1030 498 963 478 900 542 Z"
              fill="#777" />
            <path
              d="M900 542 C980 488 1042 500 1088 565 L1040 610 C990 573 945 570 900 610 Z"
              fill="#222" opacity=".8" />

            <g transform="translate(860 130)">
              <ellipse cx="30" cy="18" rx="42" ry="25" fill="#aaa" /><rect
                x="-12" y="18" width="84" height="70"
                fill="url(#cyl)" /><ellipse cx="30" cy="88" rx="42" ry="25"
                fill="#777" />
              <ellipse cx="130" cy="62" rx="42" ry="25" fill="#aaa" /><rect
                x="88" y="62" width="84" height="65" fill="url(#cyl)" /><ellipse
                cx="130" cy="127" rx="42" ry="25" fill="#777" />
              <rect x="58" y="52" width="48" height="45" fill="#777" />
            </g>
          </g>
        </svg>
      </div>
    </main>

    <script>
const ids = ['grainFreq','grainOpacity','stainFreq','stainOpacity','displace','blur','contrast','wash','shadowBlur','shadowOpacity'];
const defaults = Object.fromEntries(ids.map(id => [id, document.getElementById(id).value]));
defaults.paperColor = '#d8d6ce';
let seedA = 12, seedB = 4;
function v(id){return document.getElementById(id).value}
function out(id, val){document.getElementById(id+'Out').textContent = val}
function filterMarkup(){
  const grainAlpha = v('grainOpacity');
  const stainAlpha = v('stainOpacity');
  return `
<filter id="paperNoise" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${v('stainFreq')}" numOctaves="6" seed="${seedB}" result="stains"/>
  <feColorMatrix in="stains" type="saturate" values="0" result="grayStains"/>
  <feComponentTransfer in="grayStains">
    <feFuncR type="linear" slope="0.45" intercept="0.50"/>
    <feFuncG type="linear" slope="0.45" intercept="0.50"/>
    <feFuncB type="linear" slope="0.45" intercept="0.50"/>
    <feFuncA type="linear" slope="${stainAlpha}"/>
  </feComponentTransfer>
</filter>

<filter id="dirtyObject" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feTurbulence type="fractalNoise" baseFrequency="${v('grainFreq')}" numOctaves="4" seed="${seedA}" result="grain"/>
  <feTurbulence type="fractalNoise" baseFrequency="${v('stainFreq')}" numOctaves="5" seed="${seedB}" result="clouds"/>
  <feDisplacementMap in="SourceGraphic" in2="clouds" scale="${v('displace')}" xChannelSelector="R" yChannelSelector="G" result="warped"/>
  <feGaussianBlur in="warped" stdDeviation="${v('blur')}" result="softened"/>
  <feColorMatrix in="grain" type="matrix" values="0.25 0.25 0.25 0 0  0.25 0.25 0.25 0 0  0.25 0.25 0.25 0 0  0 0 0 ${grainAlpha} 0" result="grainAlpha"/>
  <feBlend in="softened" in2="grainAlpha" mode="multiply" result="dirty"/>
  <feComponentTransfer in="dirty">
    <feFuncR type="linear" slope="${v('contrast')}" intercept="${v('wash')}"/>
    <feFuncG type="linear" slope="${v('contrast')}" intercept="${v('wash')}"/>
    <feFuncB type="linear" slope="${v('contrast')}" intercept="${v('wash')}"/>
  </feComponentTransfer>
</filter>`;
}
function update(){
  ids.forEach(id => out(id, v(id)));
  document.getElementById('paper').setAttribute('fill', v('paperColor'));
  document.querySelector('svg').style.background = v('paperColor');
  document.getElementById('shadowBlurNode').setAttribute('stdDeviation', v('shadowBlur'));
  document.querySelector('.shadows').setAttribute('opacity', v('shadowOpacity'));
  const markup = filterMarkup();
  document.getElementById('paperNoise').outerHTML = markup.match(/<filter id="paperNoise"[\s\S]*?<\/filter>/)[0];
  document.getElementById('dirtyObject').outerHTML = markup.match(/<filter id="dirtyObject"[\s\S]*?<\/filter>/)[0];
  document.getElementById('exportCode').value = markup.trim();
}
ids.concat(['paperColor']).forEach(id => document.getElementById(id).addEventListener('input', update));
document.getElementById('randomize').onclick = () => { seedA = Math.floor(Math.random()*999); seedB = Math.floor(Math.random()*999); update(); };
document.getElementById('reset').onclick = () => { ids.forEach(id => document.getElementById(id).value = defaults[id]); document.getElementById('paperColor').value = defaults.paperColor; seedA=12; seedB=4; update(); };
update();
</script>
  </body>
</html>
