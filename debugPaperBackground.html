<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Paper Background Debug</title>
        <style>
      :root {
        --bg: #e7e3d8;
        --panel: #f5f1e8;
        --ink: #2f2924;
        --line: #c8bba5;
        --accent: #7d5f3e;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 12% 10%, #f8f4ea 0%, #ece4d4 35%, transparent 60%),
          linear-gradient(145deg, #d9d2c2 0%, #f3eee3 52%, #e5dcc9 100%);
        min-height: 100vh;
      }

      .layout {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr);
        gap: 16px;
        padding: 16px;
      }

      .panel {
        background: color-mix(in srgb, var(--panel) 88%, white 12%);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
        max-height: calc(100vh - 32px);
        overflow: auto;
        box-shadow: 0 12px 28px rgba(66, 49, 31, 0.16);
      }

      .preview {
        border: 1px solid var(--line);
        border-radius: 14px;
        overflow: hidden;
        background: #f5f1e8;
        box-shadow: 0 12px 28px rgba(66, 49, 31, 0.16);
      }

      .header {
        margin-bottom: 10px;
      }

      h1 {
        font-family: "Fraunces", "Georgia", serif;
        font-size: 1.5rem;
        margin: 0;
        letter-spacing: 0.01em;
      }

      .sub {
        font-size: 0.88rem;
        opacity: 0.8;
        margin-top: 4px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        align-items: center;
        margin: 8px 0;
      }

      .row label {
        font-size: 0.86rem;
      }

      .value {
        font-size: 0.82rem;
        color: var(--accent);
        min-width: 40px;
        text-align: right;
      }

      .section {
        margin-top: 12px;
        border-top: 1px dashed var(--line);
        padding-top: 10px;
      }

      .section h2 {
        font-size: 0.92rem;
        margin: 0 0 8px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }

      input[type="range"],
      input[type="number"],
      input[type="color"] {
        width: 100%;
      }

      input[type="checkbox"] {
        transform: scale(1.12);
      }

      .buttons {
        display: flex;
                                flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        border: 1px solid #9e7b56;
        border-radius: 10px;
        background: #f8f2e7;
        color: #3f2e1f;
        padding: 8px 10px;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover {
        background: #f2e8d7;
      }

                        .status {
                                margin-top: 8px;
                                font-size: 0.8rem;
                                color: #5b4a39;
                                min-height: 1.2em;
                        }

      #paperDebugSvg {
        width: 100%;
        height: calc(100vh - 34px);
        display: block;
      }

      @media (max-width: 980px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .panel {
          max-height: none;
        }

        #paperDebugSvg {
          height: 62vh;
        }
      }
    </style>
    </head>
    <body>
        <div class="layout">
            <form id="paperControls" class="panel" autocomplete="off">
                <div class="header">
                    <h1>Paper Texture Lab</h1>
                    <div class="sub">Interactive SVG paper background with
                        grain, fibers, and dirt.</div>
                </div>

                <div class="section">
                    <h2>Canvas</h2>
                    <div class="row"><label for="width">Width</label><span
                            id="widthValue" class="value">1200</span></div>
                    <div class="row"><input id="width" type="number" min="200"
                            max="4000" step="10" value="1200" /></div>
                    <div class="row"><label for="height">Height</label><span
                            id="heightValue" class="value">900</span></div>
                    <div class="row"><input id="height" type="number" min="200"
                            max="4000" step="10" value="900" /></div>
                    <div class="row"><label for="seed">Seed</label><span
                            id="seedValue" class="value">12345</span></div>
                    <div class="row"><input id="seed" type="number" min="1"
                            max="999999999" step="1" value="12345" /></div>
                </div>

                <div class="section">
                    <h2>Paper + Grain</h2>
                    <div class="row"><label for="paperColor">Paper
                            Color</label></div>
                    <div class="row"><input id="paperColor" type="color"
                            value="#f5f1e8" /></div>
                    <div class="row"><label for="grainColor">Grain
                            Color</label></div>
                    <div class="row"><input id="grainColor" type="color"
                            value="#44413c" /></div>
                    <div class="row"><label for="grainOpacity">Grain
                            Opacity</label><span id="grainOpacityValue"
                            class="value">0.20</span></div>
                    <div class="row"><input id="grainOpacity" type="range"
                            min="0" max="1" step="0.01" value="0.20" /></div>
                    <div class="row"><label for="grainFrequencyX">Grain
                            Frequency X</label><span id="grainFrequencyXValue"
                            class="value">0.85</span></div>
                    <div class="row"><input id="grainFrequencyX" type="range"
                            min="0.05" max="2" step="0.01" value="0.85" /></div>
                    <div class="row"><label for="grainFrequencyY">Grain
                            Frequency Y</label><span id="grainFrequencyYValue"
                            class="value">0.65</span></div>
                    <div class="row"><input id="grainFrequencyY" type="range"
                            min="0.05" max="2" step="0.01" value="0.65" /></div>
                    <div class="row"><label for="grainOctaves">Grain
                            Octaves</label><span id="grainOctavesValue"
                            class="value">4</span></div>
                    <div class="row"><input id="grainOctaves" type="range"
                            min="1" max="7" step="1" value="4" /></div>
                    <div class="row"><label for="embossStrength">Emboss
                            Strength</label><span id="embossStrengthValue"
                            class="value">1.50</span></div>
                    <div class="row"><input id="embossStrength" type="range"
                            min="0" max="3" step="0.01" value="1.50" /></div>
                    <div class="row"><label for="embossAzimuth">Light
                            Azimuth</label><span id="embossAzimuthValue"
                            class="value">77</span></div>
                    <div class="row"><input id="embossAzimuth" type="range"
                            min="0" max="360" step="1" value="77" /></div>
                    <div class="row"><label for="embossElevation">Light
                            Elevation</label><span id="embossElevationValue"
                            class="value">35</span></div>
                    <div class="row"><input id="embossElevation" type="range"
                            min="0" max="90" step="1" value="35" /></div>
                </div>

                <div class="section">
                    <h2>Fiber Grain</h2>
                    <div class="row"><label for="includeFibers">Enable
                            Fibers</label><input id="includeFibers"
                            type="checkbox" checked /></div>
                    <div class="row"><label for="fiberColor">Fiber
                            Color</label></div>
                    <div class="row"><input id="fiberColor" type="color"
                            value="#9d8d79" /></div>
                    <div class="row"><label for="fiberCount">Fiber
                            Count</label><span id="fiberCountValue"
                            class="value">1200</span></div>
                    <div class="row"><input id="fiberCount" type="range" min="0"
                            max="1200" step="1" value="1200" /></div>
                    <div class="row"><label for="fiberLengthMin">Fiber Min
                            Length</label><span id="fiberLengthMinValue"
                            class="value">4.0</span></div>
                    <div class="row"><input id="fiberLengthMin" type="range"
                            min="1" max="40" step="0.5" value="4" /></div>
                    <div class="row"><label for="fiberLengthMax">Fiber Max
                            Length</label><span id="fiberLengthMaxValue"
                            class="value">16.0</span></div>
                    <div class="row"><input id="fiberLengthMax" type="range"
                            min="2" max="100" step="0.5" value="16" /></div>
                    <div class="row"><label for="fiberStrokeWidth">Fiber
                            Width</label><span id="fiberStrokeWidthValue"
                            class="value">0.68</span></div>
                    <div class="row"><input id="fiberStrokeWidth" type="range"
                            min="0.1" max="2" step="0.01" value="0.68" /></div>
                    <div class="row"><label for="fiberOpacity">Fiber
                            Opacity</label><span id="fiberOpacityValue"
                            class="value">0.17</span></div>
                    <div class="row"><input id="fiberOpacity" type="range"
                            min="0" max="0.6" step="0.01" value="0.17" /></div>
                </div>

                <div class="section">
                    <h2>Dirt Spots</h2>
                    <div class="row"><label for="dirtColor">Dirt
                            Color</label></div>
                    <div class="row"><input id="dirtColor" type="color"
                            value="#6c5847" /></div>
                    <div class="row"><label for="dirtCount">Dirt
                            Count</label><span id="dirtCountValue"
                            class="value">800</span></div>
                    <div class="row"><input id="dirtCount" type="range" min="0"
                            max="800" step="1" value="800" /></div>
                    <div class="row"><label for="dirtMinRadius">Dirt Min
                            Radius</label><span id="dirtMinRadiusValue"
                            class="value">0.4</span></div>
                    <div class="row"><input id="dirtMinRadius" type="range"
                            min="0.2" max="6" step="0.1" value="0.4" /></div>
                    <div class="row"><label for="dirtMaxRadius">Dirt Max
                            Radius</label><span id="dirtMaxRadiusValue"
                            class="value">2.5</span></div>
                    <div class="row"><input id="dirtMaxRadius" type="range"
                            min="0.3" max="18" step="0.1" value="2.5" /></div>
                    <div class="row"><label for="dirtOpacity">Dirt
                            Opacity</label><span id="dirtOpacityValue"
                            class="value">0.18</span></div>
                    <div class="row"><input id="dirtOpacity" type="range"
                            min="0" max="1" step="0.01" value="0.18" /></div>
                    <div class="row"><label for="dirtBlur">Dirt
                            Blur</label><span id="dirtBlurValue"
                            class="value">1.95</span></div>
                    <div class="row"><input id="dirtBlur" type="range" min="0"
                            max="6" step="0.05" value="1.95" /></div>
                </div>

                <div class="buttons">
                    <button id="randomizeSeed" type="button">New Seed</button>
                    <button id="downloadSvg" type="button">Download SVG</button>
                    <button id="savePresetUrl" type="button">Save URL</button>
                    <button id="copyPreset" type="button">Copy Preset
                        JSON</button>
                    <button id="downloadPreset" type="button">Download
                        Preset</button>
                    <button id="loadPreset" type="button">Load Preset</button>
                </div>
                <div id="presetStatus" class="status"></div>
                <input id="loadPresetInput" type="file"
                    accept="application/json" style="display:none" />
            </form>

            <div class="preview">
                <svg id="paperDebugSvg" viewBox="0 0 1200 900"
                    aria-label="Paper background preview"></svg>
            </div>
        </div>

        <script src="./paperBackgroundTexture.js"></script>
        <script src="./debugPaperBackground.js"></script>
    </body>
</html>
