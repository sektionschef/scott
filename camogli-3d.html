<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Camogli 3D Preview</title>
        <style>
      :root {
        color-scheme: dark;
        --bg: #0f1216;
        --panel: rgba(10, 12, 16, 0.72);
        --panel-border: rgba(255, 255, 255, 0.12);
        --text: #f4efe7;
        --muted: rgba(244, 239, 231, 0.7);
        --accent: #d6a65f;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(214, 166, 95, 0.18), transparent 30%),
          radial-gradient(circle at 80% 10%, rgba(255, 255, 255, 0.09), transparent 24%),
          linear-gradient(180deg, #151922 0%, #0f1216 100%);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
      }

      .hud {
        position: fixed;
        left: 16px;
        top: 16px;
        z-index: 2;
        max-width: min(360px, calc(100vw - 32px));
        padding: 14px 16px;
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: var(--panel);
        backdrop-filter: blur(12px);
        color: var(--text);
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.35);
      }

      .hud h1 {
        margin: 0 0 6px;
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .hud p {
        margin: 0 0 8px;
        font-size: 13px;
        line-height: 1.45;
        color: var(--muted);
      }

      .hud .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text);
      }

      .hud .status strong {
        color: var(--accent);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        appearance: none;
        border: 1px solid var(--panel-border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 999px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      button:hover {
        border-color: rgba(214, 166, 95, 0.5);
        background: rgba(214, 166, 95, 0.14);
      }
    </style>
    </head>
    <body>
        <div id="app"></div>
        <div class="hud">
            <h1>Camogli 3D Preview</h1>
            <p>Thirty cubes fall into a four-wall container with real collisions
                and shadows. Let the pile settle, then inspect the stack
                composition.</p>
            <p>Use the mouse to orbit, zoom, and pan around the stack.</p>
            <div class="buttons">
                <button id="resetButton" type="button">Reset scene</button>
                <button id="focusButton" type="button">Focus camera</button>
                <button id="saveViewButton" type="button">Set as default
                    view</button>
                <button id="toggleWallsButton" type="button">Show
                    outlines</button>
            </div>
            <div class="status" id="status">Loading physics...</div>
        </div>
        <script type="module" src="./camogli-3d.js"></script>
    </body>
</html>
