<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Camogli 3D Preview</title>
    <style>
      :root {
        --accent: #d6a65f;
      }

      html, body {
        width: 100%; height: 100%;
        margin: 0; overflow: hidden;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0d10;
      }

      /* ── Root grid: canvas pane | sidebar ── */
      #layout {
        position: fixed;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        overflow: hidden;
      }

      /* ── Left: canvas fills its cell, centred, black letterbox ── */
      #app {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        overflow: hidden;
        min-width: 0;
      }

      #app canvas {
        display: block;
      }

      /* ── Right: sidebar ── */
      .hud {
        padding: 16px;
        border-left: 1px solid rgba(255,255,255,0.14);
        background: rgba(9, 13, 20, 0.97);
        color: #edf2f7;
        overflow-y: auto;
        height: 100vh;
        max-height: 100vh;
        box-sizing: border-box;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
      }

      .hud h1 {
        margin: 0 0 6px;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--accent);
      }

      .hud > p {
        margin: 0 0 6px;
        font-size: 12px;
        line-height: 1.5;
        color: #9aa7b7;
      }

      /* Accordion details/summary */
      .hud details {
        margin: 10px 0;
        border: 1px solid rgba(255,255,255,0.16);
        border-radius: 8px;
        background: rgba(255,255,255,0.03);
      }

      .hud details summary {
        cursor: pointer;
        list-style: none;
        padding: 10px 12px;
        font-size: 12px;
        letter-spacing: 0.03em;
        text-transform: uppercase;
        color: #d2dbe7;
      }

      .hud details summary::-webkit-details-marker { display: none; }

      .hud details > div { padding: 0 12px 12px; }

      /* Buttons inside sidebar */
      .hud button {
        appearance: none;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.06);
        color: #edf2f7;
        padding: 8px 10px;
        border-radius: 999px;
        font: inherit;
        font-size: 12px;
        cursor: pointer;
      }

      .hud button:hover {
        border-color: rgba(214,166,95,0.5);
        background: rgba(214,166,95,0.14);
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 8px;
      }

      /* Labels / inputs inside sidebar */
      .hud label {
        font-size: 11px;
        color: #d2dbe7;
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .hud input[type="number"],
      .hud input[type="checkbox"] {
        background: #111822;
        color: #edf2f7;
        border: 1px solid rgba(255,255,255,0.22);
        border-radius: 6px;
        padding: 2px 4px;
        font: inherit;
        font-size: 11px;
      }

      /* Status line */
      .hud .status {
        margin-top: 10px;
        font-size: 12px;
        color: #edf2f7;
      }

      .hud .status strong { color: var(--accent); }

      /* Section dividers inside accordions */
      .hud .section-label {
        margin: 10px 0 4px;
        font-size: 11px;
        opacity: 0.7;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: #9aa7b7;
      }
    </style>
  </head>
  <body>
    <div id="layout">
      <div id="app"></div>

      <aside class="hud">
        <h1>Camogli 3D Preview</h1>
        <p>Orbit · zoom · pan to compose the stack, then export when
          settled.</p>

        <details open>
          <summary>Scene</summary>
          <div>
            <div class="buttons">
              <button id="resetButton" type="button">Reset scene</button>
              <button id="focusButton" type="button">Focus camera</button>
              <button id="saveViewButton" type="button">Set as default
                view</button>
              <button id="toggleWallsButton" type="button">Show
                outlines</button>
              <button id="saveLayoutButton" type="button">Save settled
                layout</button>
              <button id="restoreLayoutButton" type="button">Restore
                layout</button>
              <button id="resetStateButton" type="button">Reset saved
                state</button>
            </div>
          </div>
        </details>

        <details open>
          <summary>Export</summary>
          <div>
            <div class="buttons">
              <button id="exportSvgButton" type="button">Export SVG</button>
              <button id="exportGrayscaleSvgButton" type="button">Export
                Grayscale SVG</button>
              <button id="exportNoShadowSvgButton" type="button">Export SVG (no
                shadows)</button>
            </div>
          </div>
        </details>

        <details>
          <summary>Shadow debug</summary>
          <div>
            <div class="buttons" style="gap:6px;">
              <label
                title="Switch shadow extraction mode: raster uses image-diff detection, geometry uses the analytic path.">
                raster
                <input id="shadowRasterToggle" type="checkbox" checked
                  title="On: raster shadow detection. Off: geometry-based shadow detection." />
              </label>
              <label
                title="Brightness difference threshold. Higher catches only stronger shadows; lower is more sensitive.">
                delta
                <input id="shadowDeltaInput" type="number" step="0.001"
                  min="0.005"
                  max="0.08" style="width:62px;" value="0.028"
                  title="Raster threshold. Typical range: 0.015-0.045." />
              </label>
              <label
                title="Minimum connected component size ratio. Higher removes tiny noise blobs.">
                minComp
                <input id="shadowMinCompInput" type="number" step="0.00001"
                  min="0.00002" max="0.002" style="width:72px;" value="0.00012"
                  title="Minimum blob size ratio. Typical range: 0.00008-0.0006." />
              </label>
              <label
                title="Floor shadow polygon simplification. Higher gives smoother/simpler outlines.">
                simpFloor
                <input id="shadowSimplifyFloorInput" type="number" step="0.1"
                  min="0.5" max="8" style="width:62px;" value="2.4"
                  title="Floor polygon simplify epsilon. Typical range: 1.5-3.5." />
              </label>
              <label
                title="Cube shadow polygon simplification. Higher gives smoother/simpler outlines.">
                simpCube
                <input id="shadowSimplifyCubeInput" type="number" step="0.1"
                  min="0.5"
                  max="8" style="width:62px;" value="2.2"
                  title="Cube polygon simplify epsilon. Typical range: 1.3-3.2." />
              </label>
              <label
                title="Overlay debug fills in SVG export: green for floor shadow polygons, red for cube shadow polygons.">
                fills
                <input id="shadowDebugFillToggle" type="checkbox"
                  title="Enable red/green diagnostic fills in the exported SVG." />
              </label>
            </div>
          </div>
        </details>

        <details>
          <summary>FilledPath export</summary>
          <div>
            <div class="buttons" style="gap:6px;">
              <label
                title="Ribbon width of each filledPath stroke. Larger values make strokes thicker.">
                width
                <input id="filledPathWidthInput" type="number" step="0.05"
                  min="0.2"
                  max="3" style="width:62px;" value="1.0"
                  title="FilledPath ribbon width. Typical range: 0.6-1.8." />
              </label>
              <label
                title="Random offset amount for filledPath endpoints. Higher values look rougher.">
                jitter
                <input id="filledPathJitterInput" type="number" step="0.05"
                  min="0"
                  max="2" style="width:62px;" value="1.5"
                  title="FilledPath jitter amount. Typical range: 0.6-1.6." />
              </label>
              <label
                title="Curve bend factor for filledPath shape. Negative and positive values change bow direction.">
                bend
                <input id="filledPathBendInput" type="number" step="0.01"
                  min="-0.4"
                  max="0.4" style="width:62px;" value="-0.05"
                  title="FilledPath bend. Typical range: -0.12 to 0.12." />
              </label>
              <label title="Stable seed for export hatching randomness.">
                seed
                <input id="filledPathSeedInput" type="number" step="1" min="1"
                  max="2147483646" style="width:92px;" value="12345"
                  title="Hatching seed. Same seed keeps pattern identity stable across parameter edits." />
              </label>
            </div>
          </div>
        </details>

        <div class="status" id="status">Loading physics...</div>
      </aside>
    </div>

    <script src="./gaussian.js?v=20260607-1"></script>
    <script src="./utilsSVG.js?v=20260607-1"></script>
    <script src="./paperBackgroundTexture.js?v=20260607-1"></script>
    <script type="module"
      src="./polygon-clipping.umd.min.js?v=20260607-1"></script>
    <script type="module" src="./camogli-3d.js?v=20260607-1"></script>
  </body>
</html>
